# ECHO — shared experimental configuration.
# Every model is trained with exactly these settings ("comparable conditions").

data:
  dataset: roneneldan/TinyStories
  train_stories: 30000        # stories taken from the official train split
  val_stories: 2500           # from the official validation split
  test_stories: 2500          # disjoint slice of the official validation split
  vocab_size: 8000            # most frequent words; the rest map to <unk>
  window: 24                  # words of context fed to the model

model:
  embed_dim: 128
  hidden_dim: 256
  num_layers: 2
  dropout: 0.25
  # Bonus contender only (not part of the four-model comparison):
  transformer: {d_model: 192, layers: 4, heads: 6, ff: 768, dropout: 0.1}

train:
  batch_size: 512
  lr: 0.002
  weight_decay: 0.01
  grad_clip: 1.0
  samples_per_epoch: 2000000  # fresh random 2M windows each epoch (~1/3 of train)
  max_epochs: 8
  patience: 2                 # early stopping on validation loss
  seeds: [13, 42, 2026]

generate:
  temperatures: [0.0, 0.5, 0.8, 1.0, 1.3]   # 0.0 = greedy
  samples_per_setting: 5
  length: 60
  seeds_text:
    - "once upon a time , there was a little girl named lily . she"
    - "one day , a big dog found a red ball in the park . the dog"
    - "tom wanted to help his mom bake a cake . he"
    - "the sun was hot , so the children went to the"
    - "sam was sad because he lost his favorite toy . his friend"
